name: Build AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Tagged builds take their version from the tag (v1.2.3 -> 1.2.3).
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build AppImage
        run: npx electron-builder --linux AppImage --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: Muse-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Muse-AppImage

      - uses: softprops/action-gh-release@v3
        with:
          files: '**/*.AppImage'
          generate_release_notes: true
